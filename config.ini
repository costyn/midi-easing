[MIDI]
input_port_name = MIDI Mix
virtual_port_name = Midi Easing

[Settings]
whitelist_controls = 31,51,55,59,61,62
easing_threshold = 3
update_rate_hz = 100

[Smoothing]
# EMA smoothing parameters
# Lower alpha = MORE smoothing (more lag, smoother)
# Higher alpha = LESS smoothing (more responsive, less smooth)
default_alpha_min = 0.05
default_alpha_max = 0.5 
velocity_threshold_low = 2
velocity_threshold_high = 10
adaptive_enabled = true

[Smoothing_per_control]
# Per-control smoothing overrides
# Format: CC = alpha_min,alpha_max,vel_low,vel_high (adaptive)
# Or:     CC = fixed_alpha (non-adaptive)
18 = 0.08,0.5,2,12   # Very heavy smoothing for CC18 (test with this!)
20 = 0.1,0.5,3,10    # Very heavy smoothing for CC20
61 = 1.0             # No smoothing (instant)
62 = 1.0             # No smoothing (instant)

# Legacy easing configuration (only used if smoothing_mode = easing)
[DEFAULTS]
default_easing_duration = 3000

[Easing_durations]
18 = 3000
20 = 2500
